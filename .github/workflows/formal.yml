name: formal

on:
  push:
    paths:
      - "formal/**"
      - ".github/workflows/formal.yml"
  pull_request:
    paths:
      - "formal/**"
      - ".github/workflows/formal.yml"

jobs:
  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formal
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - run: lake update
      - run: lake build
