name: formal

on:
  push:
    paths:
      - "formal/**"
      - ".github/workflows/formal.yml"
  pull_request:
    paths:
      - "formal/**"
      - ".github/workflows/formal.yml"

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | bash -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache Lake build
        uses: actions/cache@v4
        with:
          path: formal/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain', 'formal/lake-manifest.json', 'formal/**/*.lean') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('formal/lean-toolchain', 'formal/lake-manifest.json', 'formal/**/*.lean') }}-

      - name: Build formal package
        working-directory: formal
        run: |
          lake update
          lake build
